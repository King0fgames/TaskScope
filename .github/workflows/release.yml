name: Release

# Push a tag like v1.0.0 to build the installer and portable exe and create a draft release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0); builds artifacts only, no release'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained single file
        shell: pwsh
        run: >
          dotnet publish TaskScope.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }} -o publish/app

      - name: Portable exe
        shell: pwsh
        run: Copy-Item publish/app/TaskScope.exe "publish/TaskScope-${{ steps.ver.outputs.version }}-portable.exe"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' } else { $iscc = $iscc.Source }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceExe=$PWD\publish\app\TaskScope.exe" "/DOutputDir=$PWD\publish" installer\TaskScope.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem publish/*-portable.exe, publish/*-setup.exe |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content publish/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TaskScope-${{ steps.ver.outputs.version }}
          path: |
            publish/*-portable.exe
            publish/*-setup.exe
            publish/SHA256SUMS.txt

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = (Get-ChildItem publish/*-portable.exe, publish/*-setup.exe, publish/SHA256SUMS.txt).FullName
          gh release create '${{ github.ref_name }}' --draft --title 'TaskScope ${{ steps.ver.outputs.version }}' --generate-notes @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
